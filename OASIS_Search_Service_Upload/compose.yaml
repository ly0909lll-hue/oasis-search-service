services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set a random secret}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_LIMITER: false
      SEARXNG_PUBLIC_INSTANCE: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      OASIS_SEARCH_TOKEN: ${OASIS_SEARCH_TOKEN:?set a random token of at least 32 characters}
      SEARXNG_UPSTREAM: http://searxng:8080/search
      PORT: 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
